[package]
name = "ghrr"
version = "0.0.1"
edition = "2024"
license = "Apache-2.0"
description = "GitHub Research Runner"
authors = ["schoster barak <schosterbarak@gmail.com>"]
repository = "https://github.com/schosterbarak/ghrr"
readme = "README.md"

[dependencies]
octocrab = "0.49.3"
tokio = { version = "1.50.0", features = ["full"] }
clap = { version = "4.5.60", features = ["derive"] }
csv = "1.4.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
indicatif = "0.17.11"
chrono = "0.4.42"
anyhow = "1.0.100"
thiserror = "2.0.12"
reqwest = "0.12.26"

[dev-dependencies]
assert_cmd = "2.0.16"
predicates = "3.1.2"
wiremock = "0.6.2"
tempfile = "3.15.0"
